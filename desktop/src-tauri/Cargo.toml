[package]
name = "nkata-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Nkata local agent core: index, chunking, sync, queue. Library plus a CLI for tests."
# `cargo run` and `tauri dev` start the window; the CLI is `cargo run --bin nkata-agent`.
default-run = "nkata-desktop"

[lib]
name = "nkata_agent"
path = "src/lib.rs"

[[bin]]
name = "nkata-agent"
path = "src/main.rs"

[[bin]]
name = "nkata-desktop"
path = "src/desktop.rs"
required-features = ["desktop"]

[features]
default = []
# The Tauri window. Needs WebKit on Linux; off by default so tests build anywhere.
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
axum = "0.8"
tauri = { version = "2", optional = true , features = [] }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
fastcdc = "3"
notify = "8"
notify-debouncer-full = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "io-util", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
ulid = "1"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
futures-util = "0.3"

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
