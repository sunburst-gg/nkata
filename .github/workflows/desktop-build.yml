name: desktop-build
# The desktop app for Windows and macOS. Every push to main builds both for the team to test, as
# workflow artifacts. A version tag (v0.1.0) also publishes them to the downloads bucket
# (infra/aws/downloads.yaml): under releases/<version>/ and as the fixed latest/ names the
# website links to. Every build talks to the live server; `pnpm tauri dev` keeps the local one.
# Signing: macOS signs and notarizes when the Apple secrets exist (docs/deploy.md); until then
# both are unsigned, so Windows SmartScreen warns once and macOS asks to allow the app in
# Privacy and Security.
# Tauri's build: https://v2.tauri.app/distribute/
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
env:
  VITE_NKATA_SERVER_URL: https://api.nkata.app
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis,msi
            out: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          # One dmg for Apple silicon and Intel Macs.
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            out: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      # Secrets cannot appear in an `if`; this flag can.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: A tag names the version the app carries
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but tauri.conf.json says $have"; exit 1; }
      # Tauri reads these to sign and notarize (https://v2.tauri.app/distribute/sign/macos/).
      # Set only when the certificate secret exists, so an unsigned build stays possible.
      - name: Apple signing, when the secrets exist
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        shell: bash
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"
      - name: Build the app
        working-directory: desktop
        run: pnpm tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: nkata-${{ matrix.os }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      BUCKET: ${{ vars.DOWNLOADS_BUCKET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE }}
          aws-region: ap-northeast-1
      - name: Publish under the version and as latest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dmg=$(ls out/nkata-macos-latest/*.dmg)
          exe=$(ls out/nkata-windows-latest/nsis/*.exe)
          msi=$(ls out/nkata-windows-latest/msi/*.msi)
          for f in "$dmg" "$exe" "$msi"; do
            aws s3 cp "$f" "s3://$BUCKET/releases/$version/$(basename "$f")"
          done
          # Fixed names for the website's buttons. Never cached, so a release shows at once.
          nocache=(--cache-control "no-cache")
          aws s3 cp "$dmg" "s3://$BUCKET/latest/Nkata-mac.dmg" "${nocache[@]}"
          aws s3 cp "$exe" "s3://$BUCKET/latest/Nkata-windows-setup.exe" "${nocache[@]}"
          aws s3 cp "$msi" "s3://$BUCKET/latest/Nkata-windows.msi" "${nocache[@]}"
          jq -n --arg v "$version" --arg at "$(date -u +%FT%TZ)" '{version: $v, published_at: $at}' > version.json
          aws s3 cp version.json "s3://$BUCKET/latest/version.json" "${nocache[@]}" --content-type application/json
          echo "https://$BUCKET.s3.ap-northeast-1.amazonaws.com/latest/" >> "$GITHUB_STEP_SUMMARY"
