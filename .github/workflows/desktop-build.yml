name: desktop-build
# The desktop app for Windows and macOS. Every push to main builds both for the team to test, as
# workflow artifacts. A version tag (v0.1.0) also publishes them to the downloads bucket
# (infra/aws/downloads.yaml): under releases/<version>/ and as the fixed latest/ names the
# website links to. Every build talks to the live server; `pnpm tauri dev` keeps the local one.
# Signing: macOS signs and notarizes when the Apple secrets exist (docs/deploy.md); until then
# both are unsigned, so Windows SmartScreen warns once and macOS asks to allow the app in
# Privacy and Security.
# Updates: every build signs its update packages with the updater key (secrets
# TAURI_SIGNING_PRIVATE_KEY and _PASSWORD; the public half is in tauri.conf.json), and a tag
# publishes latest/latest.json, which installed apps read to update themselves
# (desktop/src-tauri/src/updates.rs, https://v2.tauri.app/plugin/updater/).
# Tauri's build: https://v2.tauri.app/distribute/
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
env:
  VITE_NKATA_SERVER_URL: https://api.nkata.app
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis,msi
            out: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/nsis/*.exe.sig
              target/release/bundle/msi/*.msi
              target/release/bundle/msi/*.msi.sig
          # One dmg for Apple silicon and Intel Macs. The app bundle is built too: its
          # Nkata.app.tar.gz is the update package.
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            out: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
              target/universal-apple-darwin/release/bundle/macos/Nkata.app.tar.gz
              target/universal-apple-darwin/release/bundle/macos/Nkata.app.tar.gz.sig
    runs-on: ${{ matrix.os }}
    env:
      # Secrets cannot appear in an `if`; this flag can.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: A tag names the version the app carries
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but tauri.conf.json says $have"; exit 1; }
      # Tauri reads these to sign and notarize (https://v2.tauri.app/distribute/sign/macos/).
      # Set only when the certificate secret exists, so an unsigned build stays possible.
      - name: Apple signing, when the secrets exist
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        shell: bash
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"
      # A universal build merges only the main binary (the window) for both chips. Tauri still
      # bundles the package's other binary, the CLI, from the universal folder, so it is built
      # for both and merged here first. Without it the 0.1.1 macOS build failed to copy it.
      - name: The CLI for both chips
        if: runner.os == 'macOS'
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do cargo build --release --target "$t" --bin nkata-agent; done
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/nkata-agent \
            target/aarch64-apple-darwin/release/nkata-agent target/x86_64-apple-darwin/release/nkata-agent
      - name: Build the app
        working-directory: desktop
        run: pnpm tauri build ${{ matrix.args }}
      # The dmg people download opens a window: its app is not the CLI, and it is universal.
      # 0.1.0 shipped the CLI. Tauri does not leave Nkata.app beside the dmg, so the check opens it.
      - name: The downloaded app is the window
        if: runner.os == 'macOS'
        run: scripts/check-mac-app.sh "$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg)" target/universal-apple-darwin/release/nkata-agent
      - uses: actions/upload-artifact@v4
        with:
          name: nkata-${{ matrix.os }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      BUCKET: ${{ vars.DOWNLOADS_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE }}
          aws-region: ap-northeast-1
      - name: Publish under the version and as latest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dmg=$(ls out/nkata-macos-latest/dmg/*.dmg)
          app=out/nkata-macos-latest/macos/Nkata.app.tar.gz
          exe=$(ls out/nkata-windows-latest/nsis/*.exe)
          msi=$(ls out/nkata-windows-latest/msi/*.msi)
          for f in "$dmg" "$app" "$app.sig" "$exe" "$exe.sig" "$msi" "$msi.sig"; do
            aws s3 cp "$f" "s3://$BUCKET/releases/$version/$(basename "$f")"
          done
          # Fixed names for the website's buttons. Never cached, so a release shows at once.
          nocache=(--cache-control "no-cache")
          aws s3 cp "$dmg" "s3://$BUCKET/latest/Nkata-mac.dmg" "${nocache[@]}"
          aws s3 cp "$exe" "s3://$BUCKET/latest/Nkata-windows-setup.exe" "${nocache[@]}"
          aws s3 cp "$msi" "s3://$BUCKET/latest/Nkata-windows.msi" "${nocache[@]}"
          jq -n --arg v "$version" --arg at "$(date -u +%FT%TZ)" '{version: $v, published_at: $at}' > version.json
          aws s3 cp version.json "s3://$BUCKET/latest/version.json" "${nocache[@]}" --content-type application/json
          # Last, once every package it names is in place: installed apps act on it.
          scripts/updater-manifest.sh "$version" "https://$BUCKET.s3.ap-northeast-1.amazonaws.com/releases/$version" "$app" "$exe" > latest.json
          aws s3 cp latest.json "s3://$BUCKET/latest/latest.json" "${nocache[@]}" --content-type application/json
          echo "https://$BUCKET.s3.ap-northeast-1.amazonaws.com/latest/" >> "$GITHUB_STEP_SUMMARY"
