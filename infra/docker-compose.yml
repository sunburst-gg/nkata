# Local dev stack. `make dev` starts it, `make dev-down` removes it.
# Host ports: Postgres 5432, S3 API 9000, store console 9001.
# Override one that is taken: NKATA_PG_PORT, NKATA_S3_PORT, NKATA_S3_CONSOLE_PORT,
# then set DATABASE_URL and S3_ENDPOINT in .env to match.
# The store is RustFS, an S3 server with the MinIO command line and env names.
# MinIO withdrew its images from Docker Hub and quay.io in September 2026 (docs/decisions.md).
# Image and env: https://docs.rustfs.com/installation/docker.html
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nkata
      POSTGRES_PASSWORD: nkata
      POSTGRES_DB: nkata
    ports:
      - "${NKATA_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nkata -d nkata"]
      interval: 2s
      timeout: 2s
      retries: 30

  store:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: nkata
      RUSTFS_SECRET_KEY: nkata-dev-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "${NKATA_S3_PORT:-9000}:9000"
      - "${NKATA_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storedata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
  storedata:
