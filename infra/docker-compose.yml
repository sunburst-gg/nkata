# Local dev stack. `make dev` starts it, `make dev-down` removes it.
# Ports: Postgres 5432, MinIO S3 9000, MinIO console 9001.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nkata
      POSTGRES_PASSWORD: nkata
      POSTGRES_DB: nkata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nkata -d nkata"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nkata
      MINIO_ROOT_PASSWORD: nkata-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
  miniodata:
