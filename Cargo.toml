[workspace]
resolver = "2"
members = ["desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[profile.release]
lto = "thin"

# Chunking and hashing in dependencies run optimized even in dev and test builds,
# so the 2 GB gate test is bounded by disk and network, not by debug code.
[profile.dev.package."*"]
opt-level = 3
