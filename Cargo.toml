[workspace]
resolver = "2"
members = ["desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[profile.release]
lto = "thin"

# Chunking and hashing run optimized even in dev and test builds, so the 2 GB gate test is
# bounded by disk and network, not by debug code. Only these two: optimizing every dependency
# made a Tauri dev build compile hundreds of crates at -O3 and exhaust memory.
[profile.dev.package.fastcdc]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3
